name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/run_tests.py

  tek-satir:
    # the one-line installers, end to end, with the checkout as the source instead of a download
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GUROS_CLAUDE: "0"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: kur.sh
        if: runner.os != 'Windows'
        run: |
          export GUROS_KAYNAK="$GITHUB_WORKSPACE" GUROS_STATE="$RUNNER_TEMP/durum"
          bash kur.sh --vault "$RUNNER_TEMP/Deneme Vault" --ad "Deneme Kişi" --uygula
          python3 "$RUNNER_TEMP/Deneme Vault/.claude/guros/doktor.py"
          bash kur.sh --vault "$RUNNER_TEMP/Deneme Vault" --kaldir --uygula
          test ! -e "$RUNNER_TEMP/Deneme Vault/.claude/guros"
      - name: kur.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:GUROS_KAYNAK = $env:GITHUB_WORKSPACE; $env:GUROS_STATE = "$env:RUNNER_TEMP\durum51"
          powershell -NoProfile -ExecutionPolicy Bypass -File kur.ps1 --vault "$env:RUNNER_TEMP\Deneme Vault 51" --ad "Deneme Kişi" --uygula
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python "$env:RUNNER_TEMP\Deneme Vault 51\.claude\guros\doktor.py"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: kur.ps1 (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:GUROS_KAYNAK = $env:GITHUB_WORKSPACE; $env:GUROS_STATE = "$env:RUNNER_TEMP\durum7"
          pwsh -NoProfile -File kur.ps1 --vault "$env:RUNNER_TEMP\Deneme Vault 7" --ad "Deneme Kişi" --uygula
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python "$env:RUNNER_TEMP\Deneme Vault 7\.claude\guros\doktor.py"
          if ($LASTEXITCODE -ne 0) { exit 1 }
